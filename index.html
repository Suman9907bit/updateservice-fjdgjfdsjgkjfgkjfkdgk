<title>Jana Online Service - Common Services</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:#f3f8fa;
  color:#18343d;
}

/* ==============================
   HEADER
============================== */

.common-header{
  background:linear-gradient(135deg,#007d8b,#0097a7,#0085c7);
  color:#fff;
  padding:25px 15px;
  text-align:center;
}

.common-header h1{
  margin:0;
  font-size:28px;
}

.common-header p{
  margin:8px 0 0;
  font-size:14px;
  opacity:.9;
}

/* ==============================
   MAIN
============================== */

.common-container{
  max-width:1100px;
  margin:auto;
  padding:20px 15px 40px;
}

/* Search */

.common-toolbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:20px;
}

.common-count{
  font-weight:700;
  color:#007b89;
}

.common-search{
  width:300px;
  max-width:100%;
  padding:12px 15px;
  border:1px solid #cbdde2;
  border-radius:12px;
  outline:none;
  font-size:14px;
  background:#fff;
}

.common-search:focus{
  border-color:#0097a7;
  box-shadow:0 0 0 3px rgba(0,151,167,.10);
}

/* ==============================
   SERVICE GRID
============================== */

.common-service-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.common-service-card{
  background:#fff;
  border:1px solid #e1ecef;
  border-radius:16px;
  padding:18px;
  cursor:pointer;
  transition:.25s;
  box-shadow:0 5px 18px rgba(0,80,100,.06);
}

.common-service-card:hover{
  transform:translateY(-4px);
  border-color:#8dd4dc;
  box-shadow:0 12px 30px rgba(0,130,145,.13);
}

.common-service-icon{
  width:50px;
  height:50px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e7f8fa;
  font-size:25px;
  margin-bottom:12px;
}

.common-service-card h3{
  margin:0 0 7px;
  color:#007d8b;
  font-size:16px;
}

.common-service-card p{
  margin:0;
  color:#71828a;
  font-size:12px;
  line-height:1.5;
}

.common-service-card-footer{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #edf2f3;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.common-service-card-footer span:first-child{
  color:#007d8b;
  font-size:12px;
  font-weight:700;
}

.common-service-arrow{
  color:#0097a7;
  font-size:20px;
}

/* No result */

.common-no-result{
  display:none;
  text-align:center;
  padding:40px 15px;
  color:#7c8b91;
}

/* ==============================
   MODAL
============================== */

.common-modal-overlay{
  position:fixed;
  inset:0;
  z-index:9999;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(8,28,39,.70);
  backdrop-filter:blur(5px);
}

.common-modal-overlay.active{
  display:flex;
}

.common-modal{
  width:100%;
  max-width:760px;
  max-height:90vh;
  overflow:hidden;
  background:#fff;
  border-radius:20px;
  box-shadow:0 25px 70px rgba(0,0,0,.3);
}

/* Modal Header */

.common-modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  padding:19px 21px;
  color:#fff;
  background:linear-gradient(135deg,#007d8b,#00a5b5);
}

.common-modal-title-area{
  display:flex;
  align-items:center;
  gap:13px;
}

.common-modal-icon{
  width:47px;
  height:47px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:13px;
  background:rgba(255,255,255,.17);
  font-size:22px;
}

.common-modal-header h3{
  margin:0 0 3px;
  font-size:18px;
}

.common-modal-header p{
  margin:0;
  font-size:12px;
  opacity:.85;
}

.common-modal-close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.14);
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

/* Modal Body */

.common-modal-body{
  padding:20px;
  max-height:55vh;
  overflow-y:auto;
}

.common-modal-label{
  color:#526875;
  font-size:13px;
  font-weight:700;
  margin-bottom:12px;
}

.common-service-links{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.common-service-link{
  display:block;
  text-decoration:none;
  padding:15px;
  border:1px solid #e2edf1;
  border-radius:13px;
  background:#f9fcfd;
  transition:.22s;
}

.common-service-link:hover{
  transform:translateY(-3px);
  background:#fff;
  border-color:#9edbe1;
  box-shadow:0 8px 20px rgba(0,130,145,.10);
}

.common-service-link strong{
  display:block;
  color:#007f8d;
  font-size:13px;
  margin-bottom:5px;
}

.common-service-link span{
  display:block;
  color:#748591;
  font-size:11px;
  line-height:1.4;
}

/* Footer */

.common-modal-footer{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:14px 19px;
  border-top:1px solid #e8eef1;
  background:#fbfdfe;
  flex-wrap:wrap;
}

.common-contact-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.common-contact-buttons a{
  display:inline-flex;
  align-items:center;
  gap:7px;
  text-decoration:none;
  padding:10px 14px;
  border-radius:10px;
  font-size:13px;
  font-weight:700;
}

.common-call-button{
  color:#007989;
  background:#e5f7f9;
}

.common-whatsapp-button{
  color:#fff;
  background:#0097a7;
}

.common-modal-footer small{
  color:#7b8c96;
  font-size:11px;
}

/* ==============================
   RESPONSIVE
============================== */

@media(max-width:900px){

  .common-service-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .common-service-links{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:600px){

  .common-toolbar{
    display:block;
  }

    width:100%;
    margin-top:10px;
  }

  .common-service-grid{

  .common-service-card h3{

  }

  .common-service-links{
    grid-template-columns:1fr;
  }

  .common-modal-footer{

  }

@media(max-width:420px){

const grid =

const count =
  document.getElementById("commonServiceCount");

const search =

const noResult =

const modal =

const modalDescription =

const modalLinks =
  document.getElementById("commonServiceLinks");

const callButton =
  document.getElementById("commonCallButton");

const whatsappButton =
  document.getElementById("commonWhatsappButton");


/* =========================================
   RENDER SERVICES
========================================= */

function renderServices(list){

  grid.innerHTML = "";

  count.textContent =
    list.length + " Services Available";

  if(!list.length){

    noResult.style.display = "block";
    return;

  }

  noResult.style.display = "none";


  list.forEach(service => {

    const card =
      document.createElement("article");

    card.className =
      "common-service-card";


    const icon =
      document.createElement("div");

    icon.className =
      "common-service-icon";

    icon.textContent =
      service.icon;


    const title =
      document.createElement("h3");

    title.textContent =
      service.name;


    const description =
      document.createElement("p");

    description.textContent =
      service.description;


    const footer =
      document.createElement("div");

    footer.className =
      "common-service-card-footer";


    const view =
      document.createElement("span");

    view.textContent =
      "View Options";


    const arrow =
      document.createElement("span");

    arrow.className =
      "common-service-arrow";

    arrow.textContent =
      "→";


    footer.appendChild(view);
    footer.appendChild(arrow);


    card.appendChild(icon);
    card.appendChild(title);
    card.appendChild(description);
    card.appendChild(footer);


    card.addEventListener(
      "click",
      () => openService(service)
    );


    grid.appendChild(card);

  });

}


/* =========================================
   OPEN SERVICE
========================================= */

function openService(service){

  modalIcon.textContent =
    service.icon;

  modalTitle.textContent =
    service.name;

  modalDescription.textContent =
    service.description;


  modalLinks.innerHTML = "";


  service.links.forEach(link => {

    const a =
      document.createElement("a");

    a.className =
      "common-service-link";

    a.href =
      link.url;

    a.target =
      "_blank";

    a.rel =
      "noopener noreferrer";


    const strong =
      document.createElement("strong");

    strong.textContent =
      link.title;


    const span =
      document.createElement("span");

    span.textContent =
      link.description;


    a.appendChild(strong);
    a.appendChild(span);

    modalLinks.appendChild(a);

  });


  callButton.href =
    "tel:" + COMMON_SERVICE_PHONE;


  const message =
    "Hello, I want help regarding " +
    service.name;


  whatsappButton.href =
    "https://wa.me/" +
    COMMON_SERVICE_WHATSAPP +
    "?text=" +
    encodeURIComponent(message);


  modal.classList.add("active");

  document.body.style.overflow =
    "hidden";
}


/* =========================================
   CLOSE SERVICE
========================================= */

function closeService(){

  modal.classList.remove("active");

  document.body.style.overflow = "";
}


/* =========================================
   CLOSE EVENTS
========================================= */

modalClose.addEventListener(
  "click",
  closeService
);


modal.addEventListener(
  "click",
  function(event){

    if(event.target === modal){

      closeService();

    }

  }
);


document.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Escape" &&
      modal.classList.contains("active")
    ){

      closeService();

    }

  }
);


/* =========================================
   SEARCH
========================================= */

search.addEventListener(
  "input",
  function(){

    const value =
      this.value
        .trim()
        .toLowerCase();


    const filtered =
      COMMON_ONLINE_SERVICES.filter(
        service =>

          service.name
            .toLowerCase()
            .includes(value)

          ||

          service.description
            .toLowerCase()
            .includes(value)

      );


    renderServices(filtered);

  }
);


/* =========================================
   START
========================================= */

renderServices(
  COMMON_ONLINE_SERVICES
);

</script>

</body>
</html>
