<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#007f8c">
<meta name="description" content="Jana Online Service - Common Online Services and useful government portals.">
<title>Jana Online Service | Common Online Services</title>
<style>
:root{--teal:#007f8c;--deep:#005c6b;--aqua:#00b8c4;--blue:#087de0;--ink:#173b46;--muted:#718590;--line:#e2edf1;--page:#f3f8fc;--shadow:0 8px 28px rgba(20,75,100,.075);--lift:0 18px 42px rgba(0,119,145,.17)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 0 0,rgba(0,184,196,.09),transparent 35%),radial-gradient(ellipse at 100% 20%,rgba(8,125,224,.07),transparent 32%),var(--page);-webkit-font-smoothing:antialiased}
button,input,a{font:inherit}button,a{-webkit-tap-highlight-color:transparent}
.common-header{position:relative;isolation:isolate;overflow:hidden;padding:44px 18px 39px;text-align:center;color:#fff;background:linear-gradient(120deg,#005d70,#008e9e 52%,#087de0);box-shadow:0 12px 35px rgba(0,104,130,.19)}
.common-header:before,.common-header:after{content:"";position:absolute;z-index:-1;border:1px solid #ffffff2e;border-radius:50%;pointer-events:none}
.common-header:before{width:300px;height:300px;top:-190px;left:-65px;box-shadow:0 0 0 35px #ffffff09,0 0 0 70px #ffffff08}
.common-header:after{width:260px;height:260px;right:-75px;bottom:-195px;box-shadow:0 0 0 30px #ffffff09,0 0 0 60px #ffffff08}
.common-header h1{margin:0;font-size:clamp(24px,4vw,36px);line-height:1.3;font-weight:800;letter-spacing:-.6px;text-shadow:0 3px 15px #0002}
.common-header p{max-width:700px;margin:12px auto 0;font-size:14px;line-height:1.8;color:#ffffffe8}
.common-container{width:100%;max-width:1240px;margin:auto;padding:28px 22px 55px}
.common-toolbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px;padding:15px 18px;border:1px solid #dcebf0;border-radius:18px;background:#ffffffdc;box-shadow:var(--shadow)}
.common-count{display:flex;align-items:center;gap:9px;color:var(--teal);font-size:14px;font-weight:800}
.common-count:before{content:"";width:9px;height:9px;flex-shrink:0;border-radius:50%;background:#08b68a;box-shadow:0 0 0 4px #08b68a20}
.common-search{width:350px;max-width:100%;min-height:46px;padding:12px 16px;border:1px solid #dbe8ed;border-radius:13px;outline:none;color:var(--ink);background:#f8fbfd;font-size:14px;transition:.25s}
.common-search::placeholder{color:#94a6af}.common-search:hover{border-color:#9bd8df;background:#fff}.common-search:focus{border-color:var(--aqua);background:#fff;box-shadow:0 0 0 4px #00b8c41f}
.common-service-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}
.common-service-card{position:relative;isolation:isolate;min-width:0;overflow:hidden;padding:22px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow);cursor:pointer;outline:none;transition:transform .28s cubic-bezier(.2,.7,.3,1),border-color .28s,box-shadow .28s;animation:cardEnter .4s ease both}
.common-service-card:before{content:"";position:absolute;z-index:-1;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--aqua),var(--blue));transform:scaleX(0);transform-origin:left;transition:transform .3s}
.common-service-card:after{content:"";position:absolute;z-index:-1;width:150px;height:150px;top:-90px;right:-80px;border-radius:50%;background:#00b8c412;transition:transform .35s,background .35s}
.common-service-card:hover{transform:translateY(-7px);border-color:#83d3dc;box-shadow:var(--lift)}
.common-service-card:hover:before,.common-service-card:focus-visible:before{transform:scaleX(1)}
.common-service-card:hover:after{transform:scale(1.6);background:#087de015}
.common-service-card:active{transform:translateY(-2px) scale(.985)}
.common-service-card:focus-visible{border-color:var(--aqua);box-shadow:0 0 0 4px #00b8c42e}
.common-service-icon{display:flex;align-items:center;justify-content:center;width:55px;height:55px;margin-bottom:17px;border:1px solid #d5f0f2;border-radius:17px;background:linear-gradient(145deg,#e5fbfc,#edf5ff);font-size:27px;transition:transform .3s,background .3s,box-shadow .3s}
.common-service-card:hover .common-service-icon{transform:translateY(-2px) rotate(-4deg) scale(1.07);background:linear-gradient(145deg,#d2f8f7,#deebff);box-shadow:0 7px 18px #0097a71f}
.common-service-card h3{margin:0 0 9px;color:#087889;font-size:16px;font-weight:800;line-height:1.5;overflow-wrap:anywhere;transition:color .25s}
.common-service-card:hover h3{color:#0060a8}
.common-service-card p{min-height:38px;margin:0;color:var(--muted);font-size:12.5px;line-height:1.7;overflow-wrap:anywhere}
.common-service-card-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:19px;padding-top:14px;border-top:1px solid #edf2f5}
.common-service-card-footer span:first-child{color:var(--teal);font-size:12px;font-weight:800}
.common-service-arrow{display:flex;align-items:center;justify-content:center;width:31px;height:31px;flex-shrink:0;border:1px solid #d8f0f1;border-radius:10px;color:var(--teal);background:#effbfc;font-size:19px;transition:transform .25s,background .25s,color .25s}
.common-service-card:hover .common-service-arrow{transform:translateX(3px);color:#fff;background:linear-gradient(135deg,var(--teal),var(--blue))}
@keyframes cardEnter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.common-no-result{display:none;margin-top:18px;padding:45px 18px;border:1px dashed #cbdfe6;border-radius:20px;text-align:center;color:var(--muted);background:#ffffffcc}
.common-no-result h3{margin:0 0 9px;color:var(--ink);font-size:19px}.common-no-result p{margin:0;font-size:13px;line-height:1.7}
.common-modal-overlay{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:18px;background:#051827a6;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .25s,visibility .25s}
.common-modal-overlay.active{opacity:1;visibility:visible;pointer-events:auto}
.common-modal{display:flex;flex-direction:column;width:100%;max-width:780px;max-height:min(88vh,780px);overflow:hidden;border:1px solid #ffffffb3;border-radius:23px;background:#fff;box-shadow:0 30px 90px #0005;transform:translateY(20px) scale(.975);transition:transform .28s cubic-bezier(.2,.7,.3,1)}
.common-modal-overlay.active .common-modal{transform:translateY(0) scale(1)}
.common-modal-header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-shrink:0;padding:20px 23px;color:#fff;background:linear-gradient(120deg,#006d7b,#009eaa 60%,#087de0)}
.common-modal-title-area{display:flex;align-items:center;gap:13px;min-width:0}
.common-modal-icon{display:flex;align-items:center;justify-content:center;width:49px;height:49px;flex-shrink:0;border:1px solid #ffffff33;border-radius:15px;background:#ffffff26;font-size:24px}
.common-modal-header h3{margin:0 0 5px;font-size:18px;line-height:1.4;overflow-wrap:anywhere}.common-modal-header p{margin:0;color:#ffffffdf;font-size:12px;line-height:1.6}
.common-modal-close{display:flex;align-items:center;justify-content:center;width:39px;height:39px;flex-shrink:0;border:1px solid #ffffff3b;border-radius:12px;color:#fff;background:#ffffff22;font-size:25px;cursor:pointer;transition:transform .2s,background .2s}
.common-modal-close:hover{transform:rotate(90deg);background:#ffffff40}.common-modal-close:active{transform:scale(.9)}
.common-modal-body{padding:23px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.common-modal-label{display:flex;align-items:center;gap:9px;margin-bottom:16px;color:#425c69;font-size:13px;font-weight:800}
.common-modal-label:before{content:"";width:4px;height:18px;border-radius:5px;background:linear-gradient(var(--aqua),var(--blue))}
.common-service-links{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
.common-service-link{position:relative;display:block;min-width:0;padding:17px 15px;border:1px solid #e0ebf0;border-radius:15px;text-decoration:none;background:#f9fcfe;overflow-wrap:anywhere;transition:transform .23s,border-color .23s,box-shadow .23s,background .23s}
.common-service-link:after{content:"↗";position:absolute;top:12px;right:12px;color:#8caab5;font-size:15px;transition:color .2s,transform .2s}
.common-service-link:hover{transform:translateY(-3px);border-color:#82d3dc;background:#fff;box-shadow:0 9px 22px #007b921c}
.common-service-link:hover:after{color:var(--teal);transform:translate(2px,-2px)}
.common-service-link:focus-visible{outline:3px solid #00b8c440;outline-offset:2px}
.common-service-link strong{display:block;padding-right:15px;margin-bottom:7px;color:#087889;font-size:13px;line-height:1.5}
.common-service-link span{display:block;color:#718590;font-size:11.5px;line-height:1.65}
.common-modal-footer{display:flex;align-items:center;justify-content:space-between;gap:13px;flex-shrink:0;padding:15px 21px;border-top:1px solid #e8eff3;background:#fbfdff}
.common-contact-buttons{display:flex;flex-wrap:wrap;gap:9px}
.common-contact-buttons a{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:41px;padding:10px 15px;border:1px solid transparent;border-radius:11px;font-size:12.5px;font-weight:800;text-decoration:none;transition:transform .2s,box-shadow .2s,background .2s}
.common-contact-buttons a:hover{transform:translateY(-2px);box-shadow:0 6px 16px #0064781f}.common-contact-buttons a:active{transform:scale(.96)}
.common-call-button{color:#007b89;background:#e8f8fa;border-color:#d3eff2!important}.common-call-button:hover{background:#d7f3f6}
.common-whatsapp-button{color:#fff;background:linear-gradient(120deg,#009b91,#00b894)}.common-whatsapp-button:hover{background:linear-gradient(120deg,#008a80,#009f80)}
.common-modal-footer small{color:#81929c;font-size:11px;line-height:1.5}
@media(max-width:950px){.common-service-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.common-service-links{grid-template-columns:repeat(2,minmax(0,1fr))}.common-container{padding-right:18px;padding-left:18px}}
@media(max-width:600px){.common-header{padding:32px 16px 29px}.common-header h1{font-size:25px;letter-spacing:-.4px}.common-header p{margin-top:9px;font-size:12px}.common-container{padding:18px 12px 35px}.common-toolbar{display:flex;flex-direction:column;align-items:stretch;gap:13px;margin-bottom:17px;padding:14px;border-radius:16px}.common-count{font-size:13px}.common-search{width:100%;min-height:45px;font-size:13px}.common-service-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.common-service-card{padding:14px 12px;border-radius:16px}.common-service-icon{width:43px;height:43px;margin-bottom:12px;border-radius:13px;font-size:22px}.common-service-card h3{margin-bottom:6px;font-size:13px;line-height:1.5}.common-service-card p{min-height:44px;font-size:10.5px;line-height:1.6}.common-service-card-footer{gap:5px;margin-top:12px;padding-top:10px}.common-service-card-footer span:first-child{font-size:10px;line-height:1.4}.common-service-arrow{width:25px;height:25px;border-radius:8px;font-size:16px}.common-modal-overlay{align-items:flex-end;padding:0}.common-modal{width:100%;max-width:none;max-height:91dvh;border-radius:23px 23px 0 0;border-bottom:0;transform:translateY(30px)}.common-modal-overlay.active .common-modal{transform:translateY(0)}.common-modal-header{padding:16px}.common-modal-icon{width:43px;height:43px;font-size:21px}.common-modal-header h3{font-size:15px}.common-modal-header p{font-size:11px}.common-modal-body{padding:17px 14px;max-height:none}.common-service-links{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.common-service-link{padding:14px 11px;border-radius:12px}.common-service-link strong{font-size:12px}.common-service-link span{font-size:10.5px}.common-modal-footer{display:flex;flex-direction:column;align-items:stretch;padding:13px 14px calc(13px + env(safe-area-inset-bottom))}.common-contact-buttons{display:grid;grid-template-columns:1fr 1fr}.common-contact-buttons a{min-height:43px;padding:10px 8px;font-size:12px}.common-modal-footer small{text-align:center}}
@media(max-width:360px){.common-header h1{font-size:22px}.common-container{padding-right:9px;padding-left:9px}.common-service-grid{gap:8px}.common-service-card{padding:12px 10px}.common-service-card h3{font-size:12px}.common-service-card p{font-size:10px}.common-service-links{gap:8px}.common-service-link{padding:12px 9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<body>
<header class="common-header">
  <h1>⚡ Common Online Services</h1>
  <p>এখানে নতুন Service Update প্রকাশ করা হবে। নতুন আপডেট পেতে নিয়মিত Follow করুন।</p>
</header>

<main class="common-container">
  <div class="common-toolbar">
    <div id="commonServiceCount" class="common-count" aria-live="polite">0 Services Available</div>
    <input type="search" id="commonServiceSearch" class="common-search" placeholder="🔎 Service Search করুন..." aria-label="Search services">
  </div>
  <div id="commonServiceGrid" class="common-service-grid"></div>
  <div id="commonServiceNoResult" class="common-no-result">
    <h3>😔 কোনো Service পাওয়া যায়নি</h3>
    <p>অন্য কোনো Service Name দিয়ে Search করুন।</p>
  </div>
</main>

<div id="commonServiceModal" class="common-modal-overlay" aria-hidden="true">
  <section class="common-modal" role="dialog" aria-modal="true" aria-labelledby="commonModalTitle" aria-describedby="commonModalDescription">
    <div class="common-modal-header">
      <div class="common-modal-title-area">
        <div id="commonModalIcon" class="common-modal-icon">⚡</div>
        <div><h3 id="commonModalTitle">Service</h3><p id="commonModalDescription">Select an option</p></div>
      </div>
      <button type="button" id="commonModalClose" class="common-modal-close" aria-label="Close dialog">×</button>
    </div>
    <div class="common-modal-body">
      <div class="common-modal-label">Select Service Option</div>
      <div id="commonServiceLinks" class="common-service-links"></div>
    </div>
    <div class="common-modal-footer">
      <div class="common-contact-buttons">
        <a href="tel:9907992247" id="commonCallButton" class="common-call-button">📞 Call</a>
        <a href="#" id="commonWhatsappButton" class="common-whatsapp-button" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>
      </div>
      <small>Links open in new tab</small>
    </div>
  </section>
</div>

<script>
"use strict";

/* শুধু এখানে আপনার Apps Script Deploy URL বসাবেন */
const COMMON_SERVICE_API_URL = "https://script.google.com/macros/s/AKfycbxwu5XdcyydptmLM2haoseW8x1giB_fo30W-45-pZjH9jPn1IWqVAjsHaEOV4KqzAdhBQ/exec";

const COMMON_SERVICE_PHONE = "9907992247";
const COMMON_SERVICE_WHATSAPP = "919907992247";

let COMMON_ONLINE_SERVICES = [];
let lastFocusedElement = null;
let loadingServices = false;

const grid = document.getElementById("commonServiceGrid");
const count = document.getElementById("commonServiceCount");
const search = document.getElementById("commonServiceSearch");
const noResult = document.getElementById("commonServiceNoResult");
const modal = document.getElementById("commonServiceModal");
const modalClose = document.getElementById("commonModalClose");
const modalIcon = document.getElementById("commonModalIcon");
const modalTitle = document.getElementById("commonModalTitle");
const modalDescription = document.getElementById("commonModalDescription");
const modalLinks = document.getElementById("commonServiceLinks");
const callButton = document.getElementById("commonCallButton");
const whatsappButton = document.getElementById("commonWhatsappButton");

function renderServices(list) {
  grid.replaceChildren();
  count.textContent = list.length + " Services Available";
  noResult.style.display = list.length ? "none" : "block";

  list.forEach((service, index) => {
    const card = document.createElement("article");
    card.className = "common-service-card";
    card.style.animationDelay = Math.min(index * 25, 250) + "ms";
    card.setAttribute("role", "button");
    card.setAttribute("tabindex", "0");
    card.setAttribute("aria-label", "Open " + service.name);

    const icon = document.createElement("div");
    icon.className = "common-service-icon";
    icon.textContent = service.icon || "⚡";

    const title = document.createElement("h3");
    title.textContent = service.name || "Online Service";

    const description = document.createElement("p");
    description.textContent =
      service.description || "Explore available online options.";

    const footer = document.createElement("div");
    footer.className = "common-service-card-footer";

    const view = document.createElement("span");
    view.textContent = "View Options";

    const arrow = document.createElement("span");
    arrow.className = "common-service-arrow";
    arrow.setAttribute("aria-hidden", "true");
    arrow.textContent = "→";

    footer.append(view, arrow);
    card.append(icon, title, description, footer);

    card.addEventListener("click", () => openService(service, card));
    card.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openService(service, card);
      }
    });

    grid.appendChild(card);
  });
}

function loadLiveServices() {
  if (loadingServices) return;

  if (
    !COMMON_SERVICE_API_URL ||
    COMMON_SERVICE_API_URL === "PASTE_YOUR_DEPLOY_URL_HERE"
  ) {
    count.textContent = "Deploy URL Required";
    noResult.style.display = "block";
    noResult.querySelector("h3").textContent = "⚙️ API URL বসান";
    noResult.querySelector("p").textContent =
      "HTML কোডে COMMON_SERVICE_API_URL-এর জায়গায় Apps Script Web App URL বসান।";
    return;
  }

  loadingServices = true;
  count.textContent = "Loading Services...";
  noResult.style.display = "none";

  const callbackName =
    "josServicesCallback_" + Date.now() + "_" +
    Math.floor(Math.random() * 100000);

  const script = document.createElement("script");
  let finished = false;

  function finish() {
    if (finished) return;
    finished = true;
    loadingServices = false;
    script.remove();
    delete window[callbackName];
  }

  const timeout = setTimeout(() => {
    finish();

    if (!COMMON_ONLINE_SERVICES.length) {
      count.textContent = "Unable to Load Services";
      noResult.style.display = "block";
      noResult.querySelector("h3").textContent = "⚠️ সার্ভিস লোড হয়নি";
      noResult.querySelector("p").textContent =
        "Deploy URL, Web App access এবং Internet connection পরীক্ষা করুন।";
    }
  }, 15000);

  window[callbackName] = function (response) {
    if (finished) return;
    clearTimeout(timeout);
    finish();

    if (!response || response.ok !== true ||
        !Array.isArray(response.services)) {
      if (!COMMON_ONLINE_SERVICES.length) {
        count.textContent = "Unable to Load Services";
        noResult.style.display = "block";
        noResult.querySelector("h3").textContent = "⚠️ ডেটা পাওয়া যায়নি";
        noResult.querySelector("p").textContent =
          "Apps Script API-এর response পরীক্ষা করুন।";
      }
      return;
    }

    COMMON_ONLINE_SERVICES = response.services
      .filter(service => service && service.name)
      .map(service => ({
        id: String(service.id || ""),
        name: String(service.name || ""),
        description: String(service.description || ""),
        icon: String(service.icon || "⚡"),
        links: Array.isArray(service.links)
          ? service.links.filter(link =>
              link &&
              link.title &&
              /^https?:\/\/\S+$/i.test(String(link.url || ""))
            ).map(link => ({
              title: String(link.title || ""),
              description: String(link.description || ""),
              url: String(link.url || "")
            }))
          : []
      }));

    filterServices();
  };

  const separator = COMMON_SERVICE_API_URL.includes("?") ? "&" : "?";
  script.src =
    COMMON_SERVICE_API_URL + separator +
    "action=list&callback=" + encodeURIComponent(callbackName) +
    "&_ts=" + Date.now();

  script.onerror = function () {
    clearTimeout(timeout);
    finish();

    if (!COMMON_ONLINE_SERVICES.length) {
      count.textContent = "Unable to Connect";
      noResult.style.display = "block";
      noResult.querySelector("h3").textContent = "⚠️ সংযোগ করা যায়নি";
      noResult.querySelector("p").textContent =
        "Deploy URL এবং Apps Script deployment access পরীক্ষা করুন।";
    }
  };

  document.head.appendChild(script);
}

function filterServices() {
  const value = search.value.trim().toLocaleLowerCase();

  const filtered = COMMON_ONLINE_SERVICES.filter(service => {
    const searchable = [
      service.name,
      service.description,
      ...(service.links || []).flatMap(link => [
        link.title,
        link.description
      ])
    ].join(" ").toLocaleLowerCase();

    return searchable.includes(value);
  });

  renderServices(filtered);
}

function openService(service, trigger) {
  lastFocusedElement = trigger || document.activeElement;

  modalIcon.textContent = service.icon || "⚡";
  modalTitle.textContent = service.name;
  modalDescription.textContent =
    service.description || "Select an option";

  modalLinks.replaceChildren();

  if (!Array.isArray(service.links) || !service.links.length) {
    const empty = document.createElement("p");
    empty.textContent = "No service option available.";
    empty.style.cssText =
      "grid-column:1/-1;text-align:center;padding:24px;color:#71828a";
    modalLinks.appendChild(empty);
  } else {
    service.links.forEach(link => {
      if (!/^https?:\/\/\S+$/i.test(link.url || "")) return;

      const a = document.createElement("a");
      a.className = "common-service-link";
      a.href = link.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";

      const strong = document.createElement("strong");
      strong.textContent = link.title || "Open Service";

      const span = document.createElement("span");
      span.textContent = link.description || "Open online service";

      a.append(strong, span);
      modalLinks.appendChild(a);
    });
  }

  callButton.href = "tel:" + COMMON_SERVICE_PHONE;

  const message = "Hello, I want help regarding " + service.name;
  whatsappButton.href =
    "https://wa.me/" + COMMON_SERVICE_WHATSAPP +
    "?text=" + encodeURIComponent(message);

  modal.classList.add("active");
  modal.setAttribute("aria-hidden", "false");
  document.body.style.overflow = "hidden";
  modalClose.focus();
}

function closeService() {
  if (!modal.classList.contains("active")) return;

  modal.classList.remove("active");
  modal.setAttribute("aria-hidden", "true");
  document.body.style.overflow = "";

  if (lastFocusedElement &&
      typeof lastFocusedElement.focus === "function") {
    lastFocusedElement.focus();
  }
}

modalClose.addEventListener("click", closeService);

modal.addEventListener("click", event => {
  if (event.target === modal) closeService();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && modal.classList.contains("active")) {
    closeService();
  }

  if (event.key === "Tab" && modal.classList.contains("active")) {
    const focusable = modal.querySelectorAll(
      'a[href],button:not([disabled])'
    );
    if (!focusable.length) return;

    const first = focusable[0];
    const last = focusable[focusable.length - 1];

    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  }
});

search.addEventListener("input", filterServices);

loadLiveServices();
setInterval(loadLiveServices, 60000);
